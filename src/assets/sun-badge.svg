<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%" aria-label="Smiling bright sun">
  <defs>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff9c4" />
      <stop offset="60%" stop-color="#ffd54f" />
      <stop offset="100%" stop-color="#ffa000" />
    </radialGradient>
    <linearGradient id="rayGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffb300" />
      <stop offset="100%" stop-color="#ffd54f" />
    </linearGradient>
  </defs>

  <g transform="translate(80, 80)">
    <!-- 12 Rounded Sun Rays -->
    <g fill="url(#rayGrad)">
      <path d="M -6 -74 C -6 -62 6 -62 6 -74 C 6 -79 -6 -79 -6 -74 Z" transform="rotate(0)" />
      <path d="M -6 -74 C -6 -62 6 -62 6 -74 C 6 -79 -6 -79 -6 -74 Z" transform="rotate(30)" />
      <path d="M -6 -74 C -6 -62 6 -62 6 -74 C 6 -79 -6 -79 -6 -74 Z" transform="rotate(60)" />
      <path d="M -6 -74 C -6 -62 6 -62 6 -74 C 6 -79 -6 -79 -6 -74 Z" transform="rotate(90)" />
      <path d="M -6 -74 C -6 -62 6 -62 6 -74 C 6 -79 -6 -79 -6 -74 Z" transform="rotate(120)" />
      <path d="M -6 -74 C -6 -62 6 -62 6 -74 C 6 -79 -6 -79 -6 -74 Z" transform="rotate(150)" />
      <path d="M -6 -74 C -6 -62 6 -62 6 -74 C 6 -79 -6 -79 -6 -74 Z" transform="rotate(180)" />
      <path d="M -6 -74 C -6 -62 6 -62 6 -74 C 6 -79 -6 -79 -6 -74 Z" transform="rotate(210)" />
      <path d="M -6 -74 C -6 -62 6 -62 6 -74 C 6 -79 -6 -79 -6 -74 Z" transform="rotate(240)" />
      <path d="M -6 -74 C -6 -62 6 -62 6 -74 C 6 -79 -6 -79 -6 -74 Z" transform="rotate(270)" />
      <path d="M -6 -74 C -6 -62 6 -62 6 -74 C 6 -79 -6 -79 -6 -74 Z" transform="rotate(300)" />
      <path d="M -6 -74 C -6 -62 6 -62 6 -74 C 6 -79 -6 -79 -6 -74 Z" transform="rotate(330)" />
    </g>

    <!-- Sun Face Body -->
    <circle cx="0" cy="0" r="50" fill="url(#sunGlow)" stroke="#ffb300" stroke-width="3" />

    <!-- Cute Eyes -->
    <ellipse cx="-16" cy="-6" rx="4.5" ry="6" fill="#bf360c" />
    <circle cx="-18" cy="-8" r="1.8" fill="#ffffff" />
    <ellipse cx="16" cy="-6" rx="4.5" ry="6" fill="#bf360c" />
    <circle cx="14" cy="-8" r="1.8" fill="#ffffff" />

    <!-- Cute Smiling Mouth -->
    <path d="M -12 8 Q 0 20 12 8" stroke="#bf360c" stroke-width="3" fill="none" stroke-linecap="round" />

    <!-- Rosy Blushing Cheeks -->
    <circle cx="-24" cy="6" r="6" fill="#ff7043" opacity="0.6" />
    <circle cx="24" cy="6" r="6" fill="#ff7043" opacity="0.6" />
  </g>
</svg>
