<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%" aria-label="An empty patch of soft soil with a cozy seed hole, ready for a seed to be planted">
  <defs>
    <radialGradient id="emptySky" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#fff9e6" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#e8f4f8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#d4edda" stop-opacity="0.2" />
    </radialGradient>
    <linearGradient id="emptySoil" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#795548" />
      <stop offset="35%" stop-color="#5d4037" />
      <stop offset="100%" stop-color="#3e2723" />
    </linearGradient>
    <linearGradient id="emptyHull" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#4e342e" />
      <stop offset="60%" stop-color="#2d1c16" />
      <stop offset="100%" stop-color="#1b0e09" />
    </linearGradient>
    <filter id="emptyShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#2d1c16" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Sky & ambient backdrop -->
  <rect width="320" height="320" rx="28" fill="url(#emptySky)" />

  <!-- Gentle ground surface -->
  <path d="M 0 180 Q 80 170 160 177 T 320 175 L 320 320 L 0 320 Z" fill="url(#emptySoil)" />
  <path d="M 0 180 Q 80 170 160 177 T 320 175 L 320 190 Q 240 185 160 190 T 0 190 Z" fill="#81c784" opacity="0.9" />

  <!-- Little grass sprouts on surface -->
  <path d="M 48 177 Q 43 157 38 153 Q 48 163 51 177 Z" fill="#66bb6a" />
  <path d="M 53 177 Q 60 155 66 151 Q 62 165 57 177 Z" fill="#81c784" />
  <path d="M 268 175 Q 263 157 258 152 Q 269 161 272 175 Z" fill="#66bb6a" />
  <path d="M 274 175 Q 281 155 287 151 Q 283 165 278 175 Z" fill="#81c784" />

  <!-- Soil crumbs and textured pebbles -->
  <ellipse cx="80" cy="230" rx="8" ry="6" fill="#a1887f" opacity="0.6" />
  <ellipse cx="238" cy="240" rx="9" ry="6" fill="#8d6e63" opacity="0.5" />
  <ellipse cx="95" cy="285" rx="10" ry="7" fill="#8d6e63" opacity="0.7" />
  <ellipse cx="225" cy="292" rx="7" ry="5" fill="#a1887f" opacity="0.5" />
  <circle cx="128" cy="255" r="3.5" fill="#d7ccc8" opacity="0.7" />
  <circle cx="196" cy="260" r="4" fill="#d7ccc8" opacity="0.7" />

  <!-- A cozy dug hole waiting for the seed -->
  <ellipse cx="160" cy="252" rx="52" ry="26" fill="#3e2723" filter="url(#emptyShadow)" />
  <ellipse cx="160" cy="249" rx="44" ry="20" fill="#2d1c16" />
  <path d="M 116 249 Q 160 236 204 249" stroke="#5d4037" stroke-width="3" fill="none" opacity="0.7" />

  <!-- A cute seed hovering above the hole, ready to be planted -->
  <g transform="translate(160, 196) rotate(-8)" filter="url(#emptyShadow)">
    <!-- tiny root nub -->
    <path d="M -1 20 Q -3 34 3 44 Q 5 46 7 42 Q 3 32 2 20 Z" fill="#c8e6c9" />
    <!-- seed body -->
    <path d="M 0 -30 C 20 -12 25 15 15 30 C 8 38 -8 38 -15 30 C -25 15 -20 -12 0 -30 Z" fill="url(#emptyHull)" />
    <!-- sunflower stripes -->
    <path d="M 0 -25 C 12 -10 15 13 8 27" stroke="#d7ccc8" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.9" />
    <path d="M 0 -25 C -12 -10 -15 13 -8 27" stroke="#d7ccc8" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.9" />
    <path d="M 0 -23 C 0 -5 0 13 0 28" stroke="#d7ccc8" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.95" />
    <!-- sleepy, hopeful face -->
    <path d="M -7 3 Q -4 6 -1 3" stroke="#fff8e1" stroke-width="1.8" fill="none" stroke-linecap="round" />
    <path d="M 1 3 Q 4 6 7 3" stroke="#fff8e1" stroke-width="1.8" fill="none" stroke-linecap="round" />
    <path d="M -2 10 Q 0 12 2 10" stroke="#fff8e1" stroke-width="1.6" fill="none" stroke-linecap="round" />
    <ellipse cx="-8" cy="7" rx="3" ry="1.8" fill="#ff8a80" opacity="0.8" />
    <ellipse cx="8" cy="7" rx="3" ry="1.8" fill="#ff8a80" opacity="0.8" />
    <!-- tiny green sprout hint at the tip -->
    <path d="M 0 -29 Q 3 -37 8 -39 Q 5 -32 0 -28 Z" fill="#81c784" />
  </g>

  <!-- A gentle dashed "plant here" guide around the hole -->
  <ellipse cx="160" cy="252" rx="60" ry="32" fill="none" stroke="#ffe082" stroke-width="3" stroke-dasharray="7 9" opacity="0.7" />

  <!-- Friendly sparkles -->
  <g fill="#ffd54f" opacity="0.8">
    <path d="M 108 205 Q 108 198 111 198 Q 114 198 114 205 Q 114 212 111 212 Q 108 212 108 205 Z" />
    <path d="M 210 200 Q 210 194 213 194 Q 216 194 216 200 Q 216 206 213 206 Q 210 206 210 200 Z" />
    <circle cx="160" cy="160" r="2.5" />
    <circle cx="205" cy="150" r="3" />
    <circle cx="112" cy="155" r="2" />
  </g>

  <!-- Soft sunbeam overhead -->
  <path d="M 160 0 L 128 175 L 192 175 Z" fill="#fff9c4" opacity="0.16" />
</svg>
