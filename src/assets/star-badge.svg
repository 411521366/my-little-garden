<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" aria-label="Golden achievement star">
  <defs>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff176" />
      <stop offset="45%" stop-color="#ffd54f" />
      <stop offset="100%" stop-color="#ffb300" />
    </linearGradient>
    <filter id="starShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#ff8f00" flood-opacity="0.35" />
    </filter>
  </defs>

  <g transform="translate(60, 60)" filter="url(#starShadow)">
    <!-- 5-Point Star -->
    <polygon points="0,-48 14,-15 48,-15 20,7 31,40 0,20 -31,40 -20,7 -48,-15 -14,-15" 
             fill="url(#starGrad)" stroke="#ff8f00" stroke-width="2.5" stroke-linejoin="round" />

    <!-- Cute Star Face -->
    <ellipse cx="-8" cy="2" rx="2.5" ry="3.5" fill="#5d4037" />
    <circle cx="-9" cy="0.5" r="1" fill="#ffffff" />
    <ellipse cx="8" cy="2" rx="2.5" ry="3.5" fill="#5d4037" />
    <circle cx="7" cy="0.5" r="1" fill="#ffffff" />
    <path d="M -5 10 Q 0 14 5 10" stroke="#5d4037" stroke-width="2" fill="none" stroke-linecap="round" />
    <circle cx="-14" cy="7" r="2.5" fill="#ff7043" opacity="0.8" />
    <circle cx="14" cy="7" r="2.5" fill="#ff7043" opacity="0.8" />

    <!-- Top gleam highlight -->
    <polygon points="0,-44 4,-20 0,-16 -4,-20" fill="#ffffff" opacity="0.75" />
  </g>
</svg>
