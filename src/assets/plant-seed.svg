<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%" aria-label="Sunflower seed tucked safely in warm soil">
  <defs>
    <radialGradient id="skyGlow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#fff9e6" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#e8f4f8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#d4edda" stop-opacity="0.2" />
    </radialGradient>
    <linearGradient id="soilGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#795548" />
      <stop offset="35%" stop-color="#5d4037" />
      <stop offset="100%" stop-color="#3e2723" />
    </linearGradient>
    <linearGradient id="seedHull" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#4e342e" />
      <stop offset="60%" stop-color="#2d1c16" />
      <stop offset="100%" stop-color="#1b0e09" />
    </linearGradient>
    <linearGradient id="seedStripe" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff8e1" />
      <stop offset="100%" stop-color="#d7ccc8" />
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#2d1c16" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Sky & ambient backdrop -->
  <rect width="320" height="320" rx="28" fill="url(#skyGlow)" />

  <!-- Gentle ground surface & grass tufts -->
  <path d="M 0 175 Q 80 165 160 172 T 320 170 L 320 320 L 0 320 Z" fill="url(#soilGrad)" />
  <path d="M 0 175 Q 80 165 160 172 T 320 170 L 320 185 Q 240 180 160 185 T 0 185 Z" fill="#81c784" opacity="0.9" />

  <!-- Little grass sprouts on surface -->
  <path d="M 50 172 Q 45 152 40 148 Q 50 158 53 172 Z" fill="#66bb6a" />
  <path d="M 55 172 Q 62 150 68 146 Q 64 160 59 172 Z" fill="#81c784" />
  <path d="M 265 170 Q 260 152 255 147 Q 266 156 269 170 Z" fill="#66bb6a" />
  <path d="M 271 170 Q 278 152 284 148 Q 280 160 275 170 Z" fill="#81c784" />

  <!-- Soil crumbs and textured organic pebbles -->
  <ellipse cx="75" cy="215" rx="7" ry="5" fill="#a1887f" opacity="0.6" />
  <ellipse cx="235" cy="225" rx="9" ry="6" fill="#8d6e63" opacity="0.5" />
  <ellipse cx="90" cy="275" rx="10" ry="7" fill="#8d6e63" opacity="0.7" />
  <ellipse cx="220" cy="285" rx="6" ry="4" fill="#a1887f" opacity="0.5" />
  <ellipse cx="160" cy="295" rx="12" ry="7" fill="#4e342e" opacity="0.8" />
  <circle cx="120" cy="245" r="3.5" fill="#d7ccc8" opacity="0.7" />
  <circle cx="195" cy="250" r="4" fill="#d7ccc8" opacity="0.7" />
  <circle cx="140" cy="210" r="3" fill="#ffe082" opacity="0.6" />
  <circle cx="178" cy="212" r="3" fill="#ffe082" opacity="0.6" />

  <!-- Cozy warm seed nest in soil -->
  <ellipse cx="160" cy="235" rx="48" ry="36" fill="#4e342e" opacity="0.4" filter="url(#softShadow)" />

  <!-- Sunflower Seed (tilted comfortably) -->
  <g transform="translate(160, 230) rotate(-18)">
    <!-- Tiny new root emerging downward -->
    <path d="M -2 22 Q -5 45 6 62 Q 9 65 12 60 Q 6 42 4 22 Z" fill="#c8e6c9" />
    <path d="M 2 24 Q 0 44 8 58" stroke="#a5d6a7" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <!-- Tiny root hairs -->
    <path d="M 3 38 Q -5 42 -8 40" stroke="#c8e6c9" stroke-width="1.5" fill="none" stroke-linecap="round" />
    <path d="M 6 48 Q 14 52 16 50" stroke="#c8e6c9" stroke-width="1.5" fill="none" stroke-linecap="round" />

    <!-- Seed Body -->
    <path d="M 0 -36 C 24 -15 30 18 18 36 C 10 46 -10 46 -18 36 C -30 18 -24 -15 0 -36 Z" 
          fill="url(#seedHull)" filter="url(#softShadow)" />

    <!-- Classic Sunflower Stripes -->
    <path d="M 0 -30 C 14 -12 18 16 10 32" stroke="url(#seedStripe)" stroke-width="3.5" fill="none" stroke-linecap="round" opacity="0.9" />
    <path d="M 0 -30 C -14 -12 -18 16 -10 32" stroke="url(#seedStripe)" stroke-width="3.5" fill="none" stroke-linecap="round" opacity="0.9" />
    <path d="M 0 -28 C 0 -6 0 16 0 34" stroke="url(#seedStripe)" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.95" />

    <!-- Cute sleeping face on seed -->
    <!-- Sweet closed eyelids -->
    <path d="M -8 4 Q -5 8 -2 4" stroke="#fff8e1" stroke-width="2" fill="none" stroke-linecap="round" />
    <path d="M 2 4 Q 5 8 8 4" stroke="#fff8e1" stroke-width="2" fill="none" stroke-linecap="round" />
    <!-- Cheerful gentle smile -->
    <path d="M -2 12 Q 0 15 2 12" stroke="#fff8e1" stroke-width="1.8" fill="none" stroke-linecap="round" />
    <!-- Rosy blush cheeks -->
    <ellipse cx="-10" cy="8" rx="3.5" ry="2" fill="#ff8a80" opacity="0.8" />
    <ellipse cx="10" cy="8" rx="3.5" ry="2" fill="#ff8a80" opacity="0.8" />

    <!-- Tiny green sprout hint at seed tip -->
    <path d="M 0 -35 Q 4 -44 10 -46 Q 6 -38 0 -34 Z" fill="#81c784" />
  </g>

  <!-- Floating cozy warmth sparkles -->
  <g fill="#ffd54f" opacity="0.75">
    <path d="M 120 190 Q 120 182 123 182 Q 126 182 126 190 Q 126 198 123 198 Q 120 198 120 190 Z" />
    <path d="M 205 185 Q 205 178 208 178 Q 211 178 211 185 Q 211 192 208 192 Q 205 192 205 185 Z" />
    <circle cx="160" cy="155" r="2.5" />
    <circle cx="215" cy="140" r="3" />
    <circle cx="105" cy="145" r="2" />
  </g>

  <!-- Soft sunbeam overhead -->
  <path d="M 160 0 L 125 170 L 195 170 Z" fill="#fff9c4" opacity="0.18" />
</svg>
