<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%" aria-label="Blooming sunflower with golden petals, friendly smile, and a cheerful bumblebee">
  <defs>
    <radialGradient id="bloomSky" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#fffde7" />
      <stop offset="45%" stop-color="#e1f5fe" />
      <stop offset="100%" stop-color="#c8e6c9" />
    </radialGradient>
    <linearGradient id="bloomStalk" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2e7d32" />
      <stop offset="50%" stop-color="#4caf50" />
      <stop offset="100%" stop-color="#1b5e20" />
    </linearGradient>
    <linearGradient id="petalBack" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#fb8c00" />
      <stop offset="50%" stop-color="#ffa000" />
      <stop offset="100%" stop-color="#fbc02d" />
    </linearGradient>
    <linearGradient id="petalFront" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#f57f17" />
      <stop offset="40%" stop-color="#fbc02d" />
      <stop offset="100%" stop-color="#fff176" />
    </linearGradient>
    <radialGradient id="flowerCenter" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#6d4c41" />
      <stop offset="65%" stop-color="#4e342e" />
      <stop offset="100%" stop-color="#3e2723" />
    </radialGradient>
    <linearGradient id="bloomSoil" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#795548" />
      <stop offset="40%" stop-color="#5d4037" />
      <stop offset="100%" stop-color="#3e2723" />
    </linearGradient>
    <filter id="bloomShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#e65100" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Sky background -->
  <rect width="320" height="320" rx="28" fill="url(#bloomSky)" />

  <!-- Soil section -->
  <path d="M 0 240 Q 80 232 160 236 T 320 234 L 320 320 L 0 320 Z" fill="url(#bloomSoil)" />
  <path d="M 0 240 Q 80 232 160 236 T 320 234 L 320 248 Q 240 242 160 245 T 0 248 Z" fill="#81c784" opacity="0.95" />

  <!-- Soil pebbles & texture -->
  <circle cx="80" cy="275" r="5" fill="#a1887f" opacity="0.6" />
  <circle cx="240" cy="270" r="6" fill="#8d6e63" opacity="0.6" />
  <circle cx="150" cy="295" r="5" fill="#a1887f" opacity="0.7" />

  <!-- Underground roots -->
  <g stroke="#c8e6c9" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M 160 245 Q 158 275 160 312" />
    <path d="M 160 255 Q 130 270 115 292" stroke-width="2.5" />
    <path d="M 160 260 Q 190 275 208 298" stroke-width="2.5" />
  </g>

  <!-- Robust Stalk -->
  <path d="M 153 245 Q 156 180 157 125 L 165 125 Q 166 180 167 245 Z" fill="url(#bloomStalk)" />

  <!-- Stately lower leaves -->
  <!-- Left Leaf -->
  <g filter="url(#bloomShadow)">
    <path d="M 155 195 C 115 195 72 175 48 202 C 42 222 75 238 118 222 C 140 215 152 202 155 195 Z" fill="#43a047" />
    <path d="M 155 195 Q 105 205 60 204" stroke="#a5d6a7" stroke-width="2" fill="none" opacity="0.8" />
  </g>
  <!-- Right Leaf -->
  <g filter="url(#bloomShadow)">
    <path d="M 165 185 C 205 185 248 165 272 192 C 278 212 245 228 202 212 C 180 205 168 192 165 185 Z" fill="#4caf50" />
    <path d="M 165 185 Q 215 195 260 194" stroke="#a5d6a7" stroke-width="2" fill="none" opacity="0.8" />
  </g>

  <!-- Sunflower Head Container -->
  <g transform="translate(160, 108)" filter="url(#bloomShadow)">
    <!-- Back Petal Ring (16 petals) -->
    <g fill="url(#petalBack)">
      <path d="M 0 -24 C -8 -50 -12 -68 0 -76 C 12 -68 8 -50 0 -24 Z" transform="rotate(0)" />
      <path d="M 0 -24 C -8 -50 -12 -68 0 -76 C 12 -68 8 -50 0 -24 Z" transform="rotate(22.5)" />
      <path d="M 0 -24 C -8 -50 -12 -68 0 -76 C 12 -68 8 -50 0 -24 Z" transform="rotate(45)" />
      <path d="M 0 -24 C -8 -50 -12 -68 0 -76 C 12 -68 8 -50 0 -24 Z" transform="rotate(67.5)" />
      <path d="M 0 -24 C -8 -50 -12 -68 0 -76 C 12 -68 8 -50 0 -24 Z" transform="rotate(90)" />
      <path d="M 0 -24 C -8 -50 -12 -68 0 -76 C 12 -68 8 -50 0 -24 Z" transform="rotate(112.5)" />
      <path d="M 0 -24 C -8 -50 -12 -68 0 -76 C 12 -68 8 -50 0 -24 Z" transform="rotate(135)" />
      <path d="M 0 -24 C -8 -50 -12 -68 0 -76 C 12 -68 8 -50 0 -24 Z" transform="rotate(157.5)" />
      <path d="M 0 -24 C -8 -50 -12 -68 0 -76 C 12 -68 8 -50 0 -24 Z" transform="rotate(180)" />
      <path d="M 0 -24 C -8 -50 -12 -68 0 -76 C 12 -68 8 -50 0 -24 Z" transform="rotate(202.5)" />
      <path d="M 0 -24 C -8 -50 -12 -68 0 -76 C 12 -68 8 -50 0 -24 Z" transform="rotate(225)" />
      <path d="M 0 -24 C -8 -50 -12 -68 0 -76 C 12 -68 8 -50 0 -24 Z" transform="rotate(247.5)" />
      <path d="M 0 -24 C -8 -50 -12 -68 0 -76 C 12 -68 8 -50 0 -24 Z" transform="rotate(270)" />
      <path d="M 0 -24 C -8 -50 -12 -68 0 -76 C 12 -68 8 -50 0 -24 Z" transform="rotate(292.5)" />
      <path d="M 0 -24 C -8 -50 -12 -68 0 -76 C 12 -68 8 -50 0 -24 Z" transform="rotate(315)" />
      <path d="M 0 -24 C -8 -50 -12 -68 0 -76 C 12 -68 8 -50 0 -24 Z" transform="rotate(337.5)" />
    </g>

    <!-- Front Petal Ring (offset by 11.25 deg for full fluffy flower) -->
    <g fill="url(#petalFront)">
      <path d="M 0 -20 C -7 -44 -10 -60 0 -68 C 10 -60 7 -44 0 -20 Z" transform="rotate(11.25)" />
      <path d="M 0 -20 C -7 -44 -10 -60 0 -68 C 10 -60 7 -44 0 -20 Z" transform="rotate(33.75)" />
      <path d="M 0 -20 C -7 -44 -10 -60 0 -68 C 10 -60 7 -44 0 -20 Z" transform="rotate(56.25)" />
      <path d="M 0 -20 C -7 -44 -10 -60 0 -68 C 10 -60 7 -44 0 -20 Z" transform="rotate(78.75)" />
      <path d="M 0 -20 C -7 -44 -10 -60 0 -68 C 10 -60 7 -44 0 -20 Z" transform="rotate(101.25)" />
      <path d="M 0 -20 C -7 -44 -10 -60 0 -68 C 10 -60 7 -44 0 -20 Z" transform="rotate(123.75)" />
      <path d="M 0 -20 C -7 -44 -10 -60 0 -68 C 10 -60 7 -44 0 -20 Z" transform="rotate(146.25)" />
      <path d="M 0 -20 C -7 -44 -10 -60 0 -68 C 10 -60 7 -44 0 -20 Z" transform="rotate(168.75)" />
      <path d="M 0 -20 C -7 -44 -10 -60 0 -68 C 10 -60 7 -44 0 -20 Z" transform="rotate(191.25)" />
      <path d="M 0 -20 C -7 -44 -10 -60 0 -68 C 10 -60 7 -44 0 -20 Z" transform="rotate(213.75)" />
      <path d="M 0 -20 C -7 -44 -10 -60 0 -68 C 10 -60 7 -44 0 -20 Z" transform="rotate(236.25)" />
      <path d="M 0 -20 C -7 -44 -10 -60 0 -68 C 10 -60 7 -44 0 -20 Z" transform="rotate(258.75)" />
      <path d="M 0 -20 C -7 -44 -10 -60 0 -68 C 10 -60 7 -44 0 -20 Z" transform="rotate(281.25)" />
      <path d="M 0 -20 C -7 -44 -10 -60 0 -68 C 10 -60 7 -44 0 -20 Z" transform="rotate(303.75)" />
      <path d="M 0 -20 C -7 -44 -10 -60 0 -68 C 10 -60 7 -44 0 -20 Z" transform="rotate(326.25)" />
      <path d="M 0 -20 C -7 -44 -10 -60 0 -68 C 10 -60 7 -44 0 -20 Z" transform="rotate(348.75)" />
    </g>

    <!-- Center Seed Disc with golden floret rim -->
    <circle cx="0" cy="0" r="38" fill="#ffb300" opacity="0.4" />
    <circle cx="0" cy="0" r="35" fill="url(#flowerCenter)" />

    <!-- Cute Seed/Pollen dots around perimeter -->
    <g fill="#ffe082" opacity="0.6">
      <circle cx="0" cy="-28" r="1.5" />
      <circle cx="14" cy="-24" r="1.5" />
      <circle cx="24" cy="-14" r="1.5" />
      <circle cx="28" cy="0" r="1.5" />
      <circle cx="24" cy="14" r="1.5" />
      <circle cx="14" cy="24" r="1.5" />
      <circle cx="0" cy="28" r="1.5" />
      <circle cx="-14" cy="24" r="1.5" />
      <circle cx="-24" cy="14" r="1.5" />
      <circle cx="-28" cy="0" r="1.5" />
      <circle cx="-24" cy="-14" r="1.5" />
      <circle cx="-14" cy="-24" r="1.5" />
    </g>

    <!-- Heartwarming, Kawaii Smiling Face -->
    <!-- Big sparkly eyes with catchlights -->
    <ellipse cx="-12" cy="-4" rx="4.5" ry="6" fill="#1b0e09" />
    <circle cx="-13.5" cy="-6" r="2" fill="#ffffff" />
    <circle cx="-10.5" cy="-2" r="1" fill="#ffffff" />

    <ellipse cx="12" cy="-4" rx="4.5" ry="6" fill="#1b0e09" />
    <circle cx="10.5" cy="-6" r="2" fill="#ffffff" />
    <circle cx="13.5" cy="-2" r="1" fill="#ffffff" />

    <!-- Big cheerful smile with tongue peek -->
    <path d="M -8 6 Q 0 16 8 6 Z" fill="#d32f2f" />
    <path d="M -5 10 Q 0 14 5 10 Q 0 8 -5 10 Z" fill="#ff8a80" />
    <path d="M -10 5 Q 0 16 10 5" stroke="#1b0e09" stroke-width="2" fill="none" stroke-linecap="round" />

    <!-- Rosy blush cheeks -->
    <ellipse cx="-19" cy="3" rx="4.5" ry="3" fill="#ff7043" opacity="0.8" />
    <ellipse cx="19" cy="3" rx="4.5" ry="3" fill="#ff7043" opacity="0.8" />
  </g>

  <!-- Friendly Bumblebee flying near top right -->
  <g transform="translate(245, 65)">
    <!-- Wings with gentle flap angle -->
    <ellipse cx="-6" cy="-12" rx="7" ry="12" fill="#e1f5fe" opacity="0.85" transform="rotate(-25 -6 -12)" />
    <ellipse cx="6" cy="-12" rx="7" ry="12" fill="#e1f5fe" opacity="0.85" transform="rotate(25 6 -12)" />
    <path d="M -6 -12 L -6 -3" stroke="#b3e5fc" stroke-width="1" />
    <path d="M 6 -12 L 6 -3" stroke="#b3e5fc" stroke-width="1" />

    <!-- Bee body -->
    <ellipse cx="0" cy="0" rx="14" ry="10" fill="#fdd835" />
    <!-- Bee stripes -->
    <path d="M -4 -9 L -4 9" stroke="#212121" stroke-width="3" stroke-linecap="round" />
    <path d="M 3 -9.5 L 3 9.5" stroke="#212121" stroke-width="3" stroke-linecap="round" />

    <!-- Bee face -->
    <circle cx="-8" cy="-2" r="1.5" fill="#212121" />
    <path d="M -10 1 Q -8 3 -6 1" stroke="#212121" stroke-width="1" fill="none" />
    <circle cx="-9" cy="2" r="1.2" fill="#ff8a80" />

    <!-- Cute stinger -->
    <path d="M 14 0 L 17 -1 L 14 1 Z" fill="#212121" />

    <!-- Bee flight trail dots -->
    <circle cx="20" cy="6" r="1.2" fill="#ffa000" opacity="0.6" />
    <circle cx="26" cy="10" r="1" fill="#ffa000" opacity="0.4" />
  </g>

  <!-- Radiant celebratory stars & sparkles -->
  <g fill="#ffb300">
    <path d="M 50 45 Q 50 35 54 35 Q 58 35 58 45 Q 58 55 54 55 Q 50 55 50 45 Z" />
    <path d="M 280 120 Q 280 112 283 112 Q 286 112 286 120 Q 286 128 283 128 Q 280 128 280 120 Z" />
    <circle cx="45" cy="85" r="3" fill="#ffd54f" />
    <circle cx="285" cy="80" r="3.5" fill="#ffd54f" />
    <circle cx="160" cy="20" r="4" fill="#ffd54f" />
  </g>
</svg>
