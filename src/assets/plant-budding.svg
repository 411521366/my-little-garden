<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%" aria-label="Young sunflower plant with leafy stalk and growing flower bud">
  <defs>
    <radialGradient id="budSky" cx="50%" cy="25%" r="70%">
      <stop offset="0%" stop-color="#fffde7" />
      <stop offset="45%" stop-color="#e0f7fa" />
      <stop offset="100%" stop-color="#c8e6c9" />
    </radialGradient>
    <linearGradient id="budStalk" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2e7d32" />
      <stop offset="45%" stop-color="#4caf50" />
      <stop offset="100%" stop-color="#1b5e20" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#81c784" />
      <stop offset="50%" stop-color="#4caf50" />
      <stop offset="100%" stop-color="#2e7d32" />
    </linearGradient>
    <linearGradient id="budSepal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5d6a7" />
      <stop offset="50%" stop-color="#43a047" />
      <stop offset="100%" stop-color="#1b5e20" />
    </linearGradient>
    <radialGradient id="petalPeek" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#fff59d" />
      <stop offset="60%" stop-color="#fbc02d" />
      <stop offset="100%" stop-color="#f57f17" />
    </radialGradient>
    <linearGradient id="budSoil" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#795548" />
      <stop offset="40%" stop-color="#5d4037" />
      <stop offset="100%" stop-color="#3e2723" />
    </linearGradient>
    <filter id="softPlantShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#1b5e20" flood-opacity="0.28" />
    </filter>
  </defs>

  <!-- Sky background -->
  <rect width="320" height="320" rx="28" fill="url(#budSky)" />

  <!-- Soil section -->
  <path d="M 0 220 Q 80 210 160 215 T 320 212 L 320 320 L 0 320 Z" fill="url(#budSoil)" />
  <path d="M 0 220 Q 80 210 160 215 T 320 212 L 320 225 Q 240 218 160 222 T 0 225 Z" fill="#81c784" opacity="0.9" />

  <!-- Soil textures -->
  <ellipse cx="160" cy="220" rx="42" ry="10" fill="#6d4c41" />
  <circle cx="90" cy="255" r="5" fill="#a1887f" opacity="0.6" />
  <circle cx="235" cy="250" r="6" fill="#8d6e63" opacity="0.6" />
  <circle cx="135" cy="290" r="5" fill="#a1887f" opacity="0.7" />
  <circle cx="210" cy="295" r="5.5" fill="#8d6e63" opacity="0.7" />

  <!-- Deep root network in soil -->
  <g stroke="#c8e6c9" stroke-width="3.5" fill="none" stroke-linecap="round">
    <path d="M 160 222 Q 158 255 160 290 Q 161 305 160 315" />
    <path d="M 160 235 Q 130 252 110 275" stroke-width="2.5" />
    <path d="M 160 240 Q 190 258 215 282" stroke-width="2.5" />
    <path d="M 160 265 Q 135 285 125 305" stroke-width="2" />
    <path d="M 160 275 Q 185 292 200 310" stroke-width="2" />
  </g>

  <!-- Main Stalk -->
  <path d="M 154 222 Q 157 150 157 78 L 165 78 Q 165 150 168 222 Z" fill="url(#budStalk)" />

  <!-- Lower Left Leaf (broad, serrated) -->
  <g filter="url(#softPlantShadow)">
    <path d="M 156 182 C 120 185 75 165 52 188 C 45 205 70 225 115 212 C 138 205 152 192 156 182 Z" fill="url(#leafGrad)" />
    <!-- Leaf veins -->
    <path d="M 156 182 Q 110 192 65 190" stroke="#c8e6c9" stroke-width="2.2" fill="none" stroke-linecap="round" opacity="0.8" />
    <path d="M 125 186 Q 115 174 105 170" stroke="#c8e6c9" stroke-width="1.3" fill="none" stroke-linecap="round" opacity="0.7" />
    <path d="M 130 188 Q 120 202 115 208" stroke="#c8e6c9" stroke-width="1.3" fill="none" stroke-linecap="round" opacity="0.7" />
  </g>

  <!-- Lower Right Leaf -->
  <g filter="url(#softPlantShadow)">
    <path d="M 166 172 C 202 175 245 155 268 178 C 275 195 250 215 205 202 C 182 195 168 182 166 172 Z" fill="url(#leafGrad)" />
    <path d="M 166 172 Q 210 182 255 180" stroke="#c8e6c9" stroke-width="2.2" fill="none" stroke-linecap="round" opacity="0.8" />
    <path d="M 198 176 Q 208 164 218 160" stroke="#c8e6c9" stroke-width="1.3" fill="none" stroke-linecap="round" opacity="0.7" />
    <path d="M 202 178 Q 212 192 218 198" stroke="#c8e6c9" stroke-width="1.3" fill="none" stroke-linecap="round" opacity="0.7" />
  </g>

  <!-- Mid-Upper Left Leaf -->
  <g filter="url(#softPlantShadow)">
    <path d="M 157 125 C 125 115 88 100 70 120 C 62 135 88 152 128 142 C 146 138 155 130 157 125 Z" fill="url(#leafGrad)" />
    <path d="M 157 125 Q 115 126 80 122" stroke="#c8e6c9" stroke-width="2" fill="none" opacity="0.8" />
  </g>

  <!-- Mid-Upper Right Leaf -->
  <g filter="url(#softPlantShadow)">
    <path d="M 164 115 C 196 105 232 90 250 110 C 258 125 232 142 192 132 C 174 128 165 120 164 115 Z" fill="url(#leafGrad)" />
    <path d="M 164 115 Q 205 116 240 112" stroke="#c8e6c9" stroke-width="2" fill="none" opacity="0.8" />
  </g>

  <!-- Flower Bud at Summit -->
  <g transform="translate(161, 74)" filter="url(#softPlantShadow)">
    <!-- Golden petal tips peeking out of bud -->
    <path d="M -16 -12 Q -22 -30 -12 -38 Q -2 -34 0 -18 Z" fill="url(#petalPeek)" />
    <path d="M 16 -12 Q 22 -30 12 -38 Q 2 -34 0 -18 Z" fill="url(#petalPeek)" />
    <path d="M 0 -16 Q 0 -42 8 -44 Q 14 -32 6 -16 Z" fill="url(#petalPeek)" />
    <path d="M -8 -16 Q -4 -42 -12 -42 Q -16 -30 -6 -16 Z" fill="url(#petalPeek)" />

    <!-- Bud base calyx (receptacle) -->
    <path d="M -26 0 C -26 22 26 22 26 0 C 30 -15 -30 -15 -26 0 Z" fill="#2e7d32" />

    <!-- Overlapping green sepals (involucral bracts) -->
    <path d="M -24 4 Q -32 -16 -20 -28 Q -14 -12 -12 8 Z" fill="url(#budSepal)" />
    <path d="M 24 4 Q 32 -16 20 -28 Q 14 -12 12 8 Z" fill="url(#budSepal)" />
    <path d="M -14 8 Q -16 -24 -2 -34 Q 4 -16 2 12 Z" fill="url(#budSepal)" />
    <path d="M 14 8 Q 16 -24 2 -34 Q -4 -16 -2 12 Z" fill="url(#budSepal)" />
    <path d="M -8 10 Q 0 -30 0 -36 Q 4 -28 6 10 Z" fill="#66bb6a" />

    <!-- Cute expectant smile on the bud -->
    <circle cx="-5" cy="0" r="1.8" fill="#1b5e20" />
    <circle cx="5" cy="0" r="1.8" fill="#1b5e20" />
    <path d="M -3 4 Q 0 7 3 4" stroke="#1b5e20" stroke-width="1.3" fill="none" stroke-linecap="round" />
    <circle cx="-9" cy="2" r="2.2" fill="#ff8a80" opacity="0.8" />
    <circle cx="9" cy="2" r="2.2" fill="#ff8a80" opacity="0.8" />
  </g>

  <!-- Sparkles around the growing bud -->
  <g fill="#ffd54f" opacity="0.9">
    <path d="M 115 50 Q 115 42 118 42 Q 121 42 121 50 Q 121 58 118 58 Q 115 58 115 50 Z" />
    <path d="M 205 45 Q 205 38 208 38 Q 211 38 211 45 Q 211 52 208 52 Q 205 52 205 45 Z" />
    <circle cx="161" cy="25" r="3.5" />
    <circle cx="95" cy="85" r="2.5" />
    <circle cx="228" cy="80" r="2.5" />
  </g>
</svg>
