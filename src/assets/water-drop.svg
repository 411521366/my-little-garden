<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" aria-label="Glossy blue water droplet">
  <defs>
    <linearGradient id="dropGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#90e0ef" />
      <stop offset="50%" stop-color="#00b4d8" />
      <stop offset="100%" stop-color="#0077b6" />
    </linearGradient>
  </defs>

  <g transform="translate(60, 60)">
    <!-- Water Drop Shape -->
    <path d="M 0 -48 C 28 -12 40 16 28 36 C 16 52 -16 52 -28 36 C -40 16 -28 -12 0 -48 Z" 
          fill="url(#dropGrad)" stroke="#0077b6" stroke-width="2.5" />

    <!-- Glossy Highlight Curve -->
    <path d="M -16 2 C -24 16 -18 32 -6 38" stroke="#ffffff" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.8" />
    <circle cx="8" cy="-14" r="3" fill="#ffffff" opacity="0.85" />

    <!-- Cute Eyes -->
    <circle cx="-7" cy="14" r="2.5" fill="#03045e" />
    <circle cx="7" cy="14" r="2.5" fill="#03045e" />
    <circle cx="-8" cy="13" r="0.9" fill="#ffffff" />
    <circle cx="6" cy="13" r="0.9" fill="#ffffff" />

    <!-- Cute Smile -->
    <path d="M -4 21 Q 0 25 4 21" stroke="#03045e" stroke-width="1.8" fill="none" stroke-linecap="round" />

    <!-- Pink Cheeks -->
    <circle cx="-13" cy="18" r="2.5" fill="#ff8a80" opacity="0.8" />
    <circle cx="13" cy="18" r="2.5" fill="#ff8a80" opacity="0.8" />
  </g>
</svg>
